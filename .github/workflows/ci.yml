name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Java 8 / Maven ${{ matrix.maven }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        maven: ["3.6.3", "3.9.16"]
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Map a short Windows build path
        id: workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          subst N: "$env:GITHUB_WORKSPACE"

      - name: Set up Java 8 and Maven toolchain
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64
          cache: maven
          cache-dependency-path: |
            pom.xml
            src/it/**/pom.xml
          mvn-toolchain-id: java8
          mvn-toolchain-vendor: temurin

      - name: Set up Maven
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: ${{ matrix.maven }}

      - name: Install Linux native tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential gfortran autoconf automake libtool-bin

      - name: Set up MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: '2022'

      # Use the runner's native shell: bash on Linux, PowerShell on Windows.
      # Git Bash can shadow the MSVC linker with its unrelated link executable.
      - name: Build and run unit and native integration tests
        working-directory: ${{ runner.os == 'Windows' && 'N:\' || github.workspace }}
        run: mvn -B -ntp -V "-Dinvoker.debug=true" -Prun-its clean install

      - name: Generate Javadoc
        if: runner.os == 'Linux' && matrix.maven == '3.9.16'
        run: mvn -B -ntp -V javadoc:javadoc

      - name: Upload test reports and integration logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-java8-maven-${{ matrix.maven }}
          path: |
            target/it/**/build.log
            target/invoker-reports/**
            target/**/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Remove Windows drive mapping
        if: always() && steps.workspace.outcome == 'success'
        shell: pwsh
        run: |
          subst N: /D
